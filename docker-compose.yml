# docker-compose.yml — production-shape stack.
#
# TODO(phase-9): Pin all images by digest before deploying to the VPS.
#   Example: postgres:16-alpine@sha256:<digest>
#   Run `docker buildx imagetools inspect postgres:16-alpine` to get the digest.

services:
  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.manager
    image: polymarket-bidder-bot/manager:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    user: "10001:10001"
    tmpfs:
      # Decrypted secrets land here — never on the real filesystem.
      # uid/gid must match the container's non-root user (10001) — tmpfs
      # defaults to root ownership otherwise, which the entrypoint can't
      # write into under mode=0700.
      - /run/secrets:size=4m,mode=0700,uid=10001,gid=10001
      # Scratch space for the app process.
      - /tmp:size=16m,uid=10001,gid=10001
      # Unix heartbeat sockets and status.json — MANAGER_SOCKET_DIR default.
      - /run/manager:size=4m,uid=10001,gid=10001
    volumes:
      # Age private key — mounted read-only from the host; never copied into
      # the image. The host path is the dev default; override in prod via an
      # environment-specific compose override or a Docker secret.
      - type: bind
        source: ${SOPS_AGE_KEY_FILE:-~/.config/sops/age/keys.txt}
        target: /run/age/keys.txt
        read_only: true
      # Encrypted secrets directory — read-only; entrypoint decrypts to tmpfs.
      - type: bind
        source: ./secrets
        target: /app/secrets
      # Bot roster — non-secret, bind-mounted (not baked into the image) so
      # `docker compose exec manager python -m manager.reload` picks up
      # edits without a rebuild, per CLAUDE.md § Running it.
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
    ports:
      # Operator dashboard — loopback-only, per .claude/rules/06b-dashboard.md
      # invariant 4. Reach it via `ssh -L 8090:127.0.0.1:8090 user@vps`.
      - "127.0.0.1:8090:8090"
    environment:
      # dashboard_reader read-only Postgres role credentials (invariant 8 in
      # .claude/rules/06b-dashboard.md). Falls back to write-role creds with a
      # warning log if unset.
      DASHBOARD_PG_USER: ${DASHBOARD_PG_USER:-}
      DASHBOARD_PG_PASSWORD: ${DASHBOARD_PG_PASSWORD:-}
      # Bind 0.0.0.0 inside the container — Docker's host-side
      # "127.0.0.1:8090:8090" port mapping above (not the app's own bind
      # address) is what enforces loopback-only reachability here. Binding
      # 127.0.0.1 in-container is unreachable through Docker's port publish
      # entirely (bridge networking forwards to the container's interface,
      # not its loopback). See .claude/rules/06b-dashboard.md invariant 4.
      DASHBOARD_HOST: "0.0.0.0"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Postgres 16
  # TODO(phase-9): Pin postgres image by digest before deploying to the VPS.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidder}
      POSTGRES_USER: ${POSTGRES_USER:-bidder}
      # Password comes from .env (non-secret placeholder) in dev.
      # In prod it MUST be injected from the decrypted secrets — see entrypoint.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidder} -d ${POSTGRES_DB:-bidder}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}

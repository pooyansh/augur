creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: ^(.*)$
    age:
      # dev recipient — populated by `make secrets-init` on first run.
      # Paste the public key printed by age-keygen here, replacing the placeholder.
      - age1devplaceholder000000000000000000000000000000000000000000000000
      # TODO: replace with CI recipient public key.
      # The CI private key lives in the CI secret store (e.g. GitHub Actions secret SOPS_AGE_KEY).
      # Run `age-keygen` in CI setup, store the private key, paste the public key here,
      # then re-encrypt all secrets: `make secrets-rotate FILE=<name>` for each file.
      - age1ciplaceholder0000000000000000000000000000000000000000000000000
      # TODO(phase-9): replace with real prod recipient before encrypting any prod secret.
      # The prod private key must have a documented offline backup (paper or hardware token)
      # before any secret is encrypted to it. Loss of the prod key = unrecoverable secrets.
      - age1prodplaceholder00000000000000000000000000000000000000000000000

# config/bots.yaml — bot roster.
#
# This file is NOT a secret and IS committed to the repo.
# Secret references (API keys, wallet keys) use symbolic names that the
# entrypoint resolves from the decrypted secrets mount at /run/secrets/.
#
# Schema enforced by src/manager/config.py (Pydantic BotsRoster).
# Manager startup validates the full file before spawning any bot.
# A single invalid entry fails the whole load — no partial roster.
#
# Schedule format: "every:Ns" where N is a positive integer of seconds.
# Cron syntax is not yet supported (NotImplementedError with a clear message).

bots:
  - id: echo-paper-1
    strategy: null_strategy
    market:
      exchange: echo
      market_id: ECHO-TEST
    mode: paper
    schedule: "every:60s"
    signals: []
    risk:
      max_position_notional: "100"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "echo.dev"

  # BTC Up or Down — 15-minute recurring market on Polymarket.
  # slug resolves to the active window at bot startup (e.g. btc-updown-15m-1780607700).
  # outcome selects which ERC-1155 token to trade; "UP" = price higher at window close.
  # Promote to live only via the three-lock rule (see CLAUDE.md invariant 1).
  - id: btc-updown-paper-1
    strategy: momentum_v1
    market:
      exchange: polymarket
      slug: "btc-updown-15m"
      outcome: "UP"
    mode: paper
    schedule: "every:900s"
    signals:
      - name: btc_15min
    risk:
      max_position_notional: "50"
      max_daily_loss: "10"
      max_orders_per_minute: 3
    secrets:
      exchange_credentials: "polymarket.paper"

  # BTC Up or Down — 5-minute recurring market on Polymarket.
  # snipe_bot.py uses this entry with --bot-id btc-updown-5m-1.
  # Window cadence is 300 s; market_resolver auto-detects from the slug suffix.
  - id: btc-updown-5m-1
    strategy: momentum_v1
    market:
      exchange: polymarket
      slug: "btc-updown-5m"
      outcome: "UP"
    mode: paper
    schedule: "every:300s"
    signals:
      - name: btc_15min
        params: {}
    params:
      momentum_threshold_pct: "0.3"
      target_size: "5"
      max_ticks_in_position: 3
      buy_price: "0.35"
      sell_price: "0.25"
    risk:
      max_position_notional: "50"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "polymarket.live"

  # BTC Up or Down — 5-minute recurring market, dip-trigger 3-round test.
  # One "round" = one actually-placed+accepted bet. Stops on a win; on a
  # loss moves to the next 5-min window, up to max_rounds bets total.
  # LIVE — requires this bot id in the manager's live_allowlist.yaml
  # (three-lock rule, CLAUDE.md invariant 1) or it fails closed to paper.
  #
  # PAUSED 2026-07-15: repeated live order attempts from the manager
  # container were rejected by Polymarket with "Trading restricted in your
  # region" (geoblock), while the same wallet/creds placed an order fine
  # from the host directly via scripts/snipe_bot.py minutes later. Suspected
  # cause: the container's egress IP (same ISP/subnet as the host, but a
  # different specific address) lands in a flagged range within that
  # provider's pool. Re-enable only after the network path is understood —
  # see conversation notes / investigate before uncommenting.

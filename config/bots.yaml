  #      false. Both resolve to the exact same wallet/API key (verified via
  #      Secrets.slice_for("exchanges.polymarket") vs snipe_bot's
  #      secrets.get("polymarket", secrets) — identical dict).
  #   2. The adapter's shared, process-lifetime httpx client sticks to one
  #      (possibly bad) VPN exit IP for the bot's whole life — plausible

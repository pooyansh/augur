# config/bots.yaml — bot roster.
#
# This file is NOT a secret and IS committed to the repo.
# Secret references (API keys, wallet keys) use symbolic names that the
# entrypoint resolves from the decrypted secrets mount at /run/secrets/.
#
# Schema enforced by src/manager/config.py (Pydantic BotsRoster).
# Manager startup validates the full file before spawning any bot.
# A single invalid entry fails the whole load — no partial roster.
#
# Schedule format: "every:Ns" where N is a positive integer of seconds.
# Cron syntax is not yet supported (NotImplementedError with a clear message).

bots:
  - id: echo-paper-1
    strategy: null_strategy
    market:
      exchange: echo
      market_id: ECHO-TEST
    mode: paper
    schedule: "every:60s"
    signals: []
    risk:
      max_position_notional: "100"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "echo.dev"

# config/bots.yaml — bot roster.
#
# This file is NOT a secret and IS committed to the repo.
# Secret references (API keys, wallet keys) use symbolic names that the
# entrypoint resolves from the decrypted secrets mount at /run/secrets/.
#
# Schema enforced by src/manager/config.py (Pydantic BotsRoster).
# Manager startup validates the full file before spawning any bot.
# A single invalid entry fails the whole load — no partial roster.
#
# Schedule format: "every:Ns" where N is a positive integer of seconds.
# Cron syntax is not yet supported (NotImplementedError with a clear message).

bots:
  - id: echo-paper-1
    strategy: null_strategy
    market:
      exchange: echo
      market_id: ECHO-TEST
    mode: paper
    schedule: "every:60s"
    signals: []
    risk:
      max_position_notional: "100"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "echo.dev"

  # BTC Up or Down — 15-minute recurring market on Polymarket.
  # slug resolves to the active window at bot startup (e.g. btc-updown-15m-1780607700).
  # outcome selects which ERC-1155 token to trade; "UP" = price higher at window close.
  # Promote to live only via the three-lock rule (see CLAUDE.md invariant 1).
  - id: btc-updown-paper-1
    strategy: momentum_v1
    market:
      exchange: polymarket
      slug: "btc-updown-15m"
      outcome: "UP"
    mode: paper
    schedule: "every:900s"
    signals:
      - name: btc_15min
    risk:
      max_position_notional: "50"
      max_daily_loss: "10"
      max_orders_per_minute: 3
    secrets:
      exchange_credentials: "polymarket.paper"

  # BTC Up or Down — 5-minute recurring market on Polymarket.
  # snipe_bot.py uses this entry with --bot-id btc-updown-5m-1.
  # Window cadence is 300 s; market_resolver auto-detects from the slug suffix.
  - id: btc-updown-5m-1
    strategy: momentum_v1
    market:
      exchange: polymarket
      slug: "btc-updown-5m"
      outcome: "UP"
    mode: paper
    schedule: "every:300s"
    signals:
      - name: btc_15min
        params: {}
    params:
      momentum_threshold_pct: "0.3"
      target_size: "5"
      max_ticks_in_position: 3
      buy_price: "0.35"
      sell_price: "0.25"
    risk:
      max_position_notional: "50"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "polymarket.live"

  # BTC Up or Down — 5-minute recurring market, dip-trigger 3-round test.
  # One "round" = one actually-placed+accepted bet. Stops on a win; on a
  # loss moves to the next 5-min window, up to max_rounds bets total.
  # LIVE — requires this bot id in the manager's live_allowlist.yaml
  # (three-lock rule, CLAUDE.md invariant 1) or it fails closed to paper.
  #
  # Re-enabled 2026-07-15 with a new diagnostic: PolymarketAdapter._place_live
  # now pre-checks https://polymarket.com/api/geoblock immediately before
  # every order (same check Polymarket's own frontend uses). blocked=true
  # short-circuits the attempt without hitting /order; either way the result
  # is logged (polymarket_geoblock_precheck) for correlation against accept/
  # reject outcomes. Prior hypotheses ruled out: credentials (identical to
  # snipe_bot.py's path, verified), and long-lived-connection IP pinning
  # (fixed, didn't change the outcome). Live tally before this change:
  # manager path ~0/14 accepted, snipe_bot.py ~2/4 from the host.
  #
  # winning_rule added same day: opts into the fast provisional-rule
  # continuation path in dip_snipe_3round (see its module docstring and
  # .claude/rules/10-winning-rules.md) — after FAST_LOSS_STREAK consecutive
  # LOST provisional readings, the strategy advances to the next round
  # instead of blocking on Polymarket's official closed+winner fields
  # (observed to lag several minutes). Explicit, accepted tradeoff: the
  # rule can flip-flop, so a wrong fast read can fire an extra real order
  # before the true result is known — corrected after the fact once
  # authoritative settlement confirms it (dip_snipe_3round._pending_validations).
  # Requires the btc_15min signal (below) to compute anything; inert
  # (falls back to waiting on authoritative settlement) without it.
  - id: btc-dipsnipe-5m-live-1
    strategy: dip_snipe_3round
    market:
      exchange: polymarket
      slug: "btc-updown-5m"
      outcome: "UP"
    mode: live
    schedule: "every:5s"
    signals:
      - name: btc_15min
    winning_rule:
      name: polymarket.btc_up_or_down_5m.price_compare
      params:
        tolerance_pct: "0.02"
    params:
      trigger: "0.30"
      size: "5"
      max_rounds: 3
      min_window_secs: 120
      slug: "btc-updown-5m"
      outcome: "UP"
      exchange: "polymarket"
    risk:
      max_position_notional: "20"
      max_daily_loss: "10"
      max_orders_per_minute: 5
    secrets:
      exchange_credentials: "polymarket.live"

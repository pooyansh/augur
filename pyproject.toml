[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-bidder-bot"
version = "0.1.0"
description = "Automated prediction-market trading bot platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "polars>=1.0",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    "pydantic>=2.7",
    "structlog>=24",
    "tenacity>=8",
    "click>=8",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Exclude Phase 1 scout code — it uses older patterns and is out of scope for Phase 2.
exclude = ["scout/", "learnings/", "plan/", "web/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
packages = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require an external Postgres instance (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260510",
]

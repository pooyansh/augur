# Logrotate configuration for the prediction-market bot manager.
#
# Install on the VPS host:
#   sudo cp ops/logrotate/manager.conf /etc/logrotate.d/manager
#
# The log directory is /var/log/manager/ by default.
# Override via LOG_DIR env in docker-compose.yml or the entrypoint.
#
# Rotation cadence: daily, keep 14 days, compress with gzip.
# copytruncate is used because the manager process keeps the file descriptor
# open; SIGHUP-based log reopening is a Phase 9 enhancement.

/var/log/manager/*.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
}

name: web

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size gate (≤250 KB gzipped)
        # Sum the gzipped sizes of all JS bundles and fail if over 256000 bytes (250 KB).
        run: |
          python3 - <<'EOF'
          import os
          import gzip
          import glob

          js_files = glob.glob("dist/assets/*.js")
          if not js_files:
              print("WARNING: No JS bundle files found in dist/assets/")
              exit(0)

          total = 0
          for f in js_files:
              with open(f, "rb") as fh:
                  data = fh.read()
              compressed = gzip.compress(data, compresslevel=9)
              size_kb = len(compressed) / 1024
              print(f"  {os.path.basename(f)}: {size_kb:.1f} KB gzipped")
              total += len(compressed)

          total_kb = total / 1024
          print(f"\nTotal: {total_kb:.1f} KB gzipped")

          limit_kb = 250
          if total > limit_kb * 1024:
              print(f"FAIL: Bundle size {total_kb:.1f} KB exceeds {limit_kb} KB limit.")
              exit(1)
          else:
              print(f"OK: Bundle size {total_kb:.1f} KB is within {limit_kb} KB limit.")
          EOF

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7
